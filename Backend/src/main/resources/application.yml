server:
  port: 8080

spring:
  application:
    name: student-achievement-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/achievement_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: "ChangeThisSecretKeyForProductionUseAtLeast256BitsLongPlease123456"
    expiration-ms: 86400000 # 24 hours
  file-storage:
    upload-dir: ./storage
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  seed:
    enabled: true
